name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21.0.6
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0"

      - name: Download checksum-pinned tools
        shell: pwsh
        run: ./bootstrap-tools.ps1

      - name: Build patch bundle
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: redflagdeals-revanced-patches
          path: patches/build/libs/*.rvp
          if-no-files-found: error
