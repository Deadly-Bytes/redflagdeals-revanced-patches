name: Release

on:
  push:
    branches: [main]
    paths: ['gradle.properties']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release inputs
        run: |
          python3 tests/test_publish_release.py
          python3 scripts/publish-release.py --validate-only

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21.0.6
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0"

      - name: Download checksum-pinned tools
        shell: pwsh
        run: ./bootstrap-tools.ps1

      - name: Build patch bundle
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Test reply controls
        shell: pwsh
        run: ./tests/test-reply-voting.ps1

      - name: Publish bundle and update Manager source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
