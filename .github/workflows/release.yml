name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21.0.6
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0"

      - name: Download checksum-pinned tools
        shell: pwsh
        run: ./bootstrap-tools.ps1

      - name: Build patch bundle
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: patches/build/libs/*.rvp
          generate_release_notes: true
